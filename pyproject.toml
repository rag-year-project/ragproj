[project]
name = "yearproj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "miradimo", email = "nistratov7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rank-bm25>=0.2.2",
]

[project.scripts]
yearproj = "yearproj:main"

[project.optional-dependencies]
eda = [
    "ipykernel>=7.4.0",
    "langdetect>=1.0.9",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
    "pymupdf>=2.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
]
